<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Byk — majątek i inwestycje</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0E1311; --bg-2:#131A17; --surface:#161E1A; --surface-2:#1B241F;
    --line:#26312B; --line-2:#33413A; --ink:#ECEAE0; --muted:#93A099; --faint:#5F6E66;
    --gold:#C9A24B; --gold-2:#E0BC64; --gold-soft:#2A2718;
    --pos:#4FB07A; --neg:#E0655A; --pos-soft:#16281E; --neg-soft:#2A1917;
    --r:16px;
    --disp:'Bricolage Grotesque',system-ui,sans-serif;
    --ui:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
    --num:'IBM Plex Mono',ui-monospace,'SF Mono',Menlo,monospace;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{background:var(--bg);color:var(--ink);font-family:var(--ui);-webkit-font-smoothing:antialiased;font-size:14px;line-height:1.45}
  .num{font-family:var(--num);font-feature-settings:"tnum" 1;letter-spacing:-.01em}
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
  input,select{font-family:inherit;font-size:14px;color:var(--ink)}
  a{color:var(--gold-2)}
  ::selection{background:var(--gold);color:#111}

  /* ---------- Login ---------- */
  #lock{position:fixed;inset:0;background:radial-gradient(1200px 600px at 50% -10%,#17211C 0%,var(--bg) 60%);display:flex;align-items:center;justify-content:center;z-index:50;padding:20px}
  .lock-card{width:min(370px,94vw);text-align:center}
  .lock-mark{width:52px;height:52px;margin:0 auto 20px;border-radius:14px;background:linear-gradient(160deg,var(--gold-2),var(--gold));display:flex;align-items:center;justify-content:center;box-shadow:0 8px 30px rgba(201,162,75,.25)}
  .lock-mark svg{width:30px;height:30px}
  .lock-card h1{font-family:var(--disp);font-size:26px;font-weight:600;margin:0 0 6px;letter-spacing:-.02em}
  .lock-card p{color:var(--muted);margin:0 0 26px;font-size:13px}
  .auth-form{display:flex;flex-direction:column;gap:11px;text-align:left}
  .auth-form input{width:100%;padding:13px 15px;border:1px solid var(--line-2);border-radius:11px;background:var(--surface);outline:none;font-size:14px;transition:.12s}
  .auth-form input:focus{border-color:var(--gold)}
  .auth-btn{justify-content:center;width:100%;padding:13px;margin-top:2px;font-size:14.5px}
  .auth-btn:disabled{opacity:.55;cursor:default}
  .auth-toggle{color:var(--muted);font-size:12.5px;margin-top:8px;text-align:center;width:100%}
  .auth-toggle:hover{color:var(--gold-2)}
  .lock-hint{min-height:18px;font-size:12.5px;text-align:center;margin-top:2px;color:var(--muted)}
  .lock-hint.err{color:var(--neg)} .lock-hint.ok{color:var(--pos)}

  /* ---------- Shell ---------- */
  #app{display:none;min-height:100%}
  .shell{display:grid;grid-template-columns:250px 1fr;min-height:100vh}
  .side{border-right:1px solid var(--line);padding:20px 14px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;background:var(--bg-2);overflow-y:auto}
  .brand{display:flex;align-items:center;gap:11px;padding:4px 8px 20px}
  .brand .mk{width:32px;height:32px;border-radius:9px;background:linear-gradient(160deg,var(--gold-2),var(--gold));display:flex;align-items:center;justify-content:center}
  .brand .mk svg{width:19px;height:19px}
  .brand b{font-family:var(--disp);font-weight:700;letter-spacing:-.02em;font-size:19px}
  .navlabel{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--faint);padding:14px 10px 7px;font-weight:600}
  .nav{display:flex;flex-direction:column;gap:1px}
  .nav button{display:flex;align-items:center;gap:11px;padding:9px 10px;border-radius:10px;color:var(--muted);font-size:13.5px;font-weight:500;text-align:left;width:100%;transition:.12s}
  .nav button .ic{width:17px;height:17px;flex:none;opacity:.9}
  .nav button:hover{background:var(--surface);color:var(--ink)}
  .nav button.active{background:var(--surface-2);color:var(--ink)}
  .nav button.active .ic{color:var(--gold-2);opacity:1}
  .pf-item{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:10px;color:var(--muted);font-size:13.5px;font-weight:500;width:100%;text-align:left;transition:.12s}
  .pf-item:hover{background:var(--surface);color:var(--ink)}
  .pf-item.active{background:var(--surface-2);color:var(--ink)}
  .pf-badge{width:22px;height:22px;border-radius:6px;flex:none;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:700;font-family:var(--num);color:#0d0d0d}
  .pf-item .val{margin-left:auto;font-family:var(--num);font-size:11px;color:var(--faint)}
  .pf-item .grip{flex:none;display:flex;align-items:center;color:var(--faint);opacity:0;cursor:grab;margin:0 -3px 0 -4px;transition:.12s}
  .pf-item:hover .grip{opacity:.6}
  .pf-item.dragging{opacity:.4}
  .pf-item.dragover{box-shadow:inset 0 2px 0 0 var(--gold-2)}
  .add-row{color:var(--faint);font-weight:500;margin-top:4px;font-size:12.5px}
  .add-row:hover{color:var(--gold-2)}
  .side-foot{margin-top:auto;display:flex;flex-direction:column;gap:1px;border-top:1px solid var(--line);padding-top:10px;margin-top:16px}
  .side-foot .who{font-size:11px;color:var(--faint);padding:2px 10px 6px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

  .main{padding:24px clamp(18px,3vw,44px) 70px;max-width:1240px;width:100%}
  .topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:24px;flex-wrap:wrap}
  .topbar .eyebrow{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--faint);margin-bottom:6px;display:flex;align-items:center;gap:8px}
  .topbar h2{margin:0;font-family:var(--disp);font-size:28px;font-weight:600;letter-spacing:-.02em}
  .top-actions{display:flex;gap:9px;align-items:center;flex-wrap:wrap}

  .live{display:inline-flex;align-items:center;gap:7px;font-size:11.5px;color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:6px 12px}
  .live .dot{width:7px;height:7px;border-radius:50%;background:var(--faint)}
  .live.on .dot{background:var(--pos);box-shadow:0 0 0 0 rgba(79,176,122,.6);animation:pulse 1.6s infinite}
  .live.err .dot{background:var(--neg)}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(79,176,122,.5)}70%{box-shadow:0 0 0 7px rgba(79,176,122,0)}100%{box-shadow:0 0 0 0 rgba(79,176,122,0)}}

  .btn{display:inline-flex;align-items:center;gap:7px;padding:9px 15px;border-radius:10px;font-size:13px;font-weight:600;border:1px solid var(--line-2);background:var(--surface);transition:.12s;white-space:nowrap}
  .btn:hover{border-color:var(--muted)}
  .btn.pr{background:linear-gradient(160deg,var(--gold-2),var(--gold));color:#151208;border-color:transparent}
  .btn.pr:hover{filter:brightness(1.06)}
  .btn.danger{background:var(--neg);color:#fff;border-color:var(--neg)}
  .btn.danger:hover{filter:brightness(1.06)}
  .btn.ghost{background:none;border-color:var(--line)}
  .btn svg{width:15px;height:15px}
  .btn.sm{padding:6px 11px;font-size:12px}

  /* hero ledger */
  .ledger{background:linear-gradient(150deg,var(--surface-2),var(--surface));border:1px solid var(--line);border-radius:var(--r);padding:26px 28px;margin-bottom:18px;position:relative;overflow:hidden}
  .ledger::after{content:"";position:absolute;right:-60px;top:-60px;width:220px;height:220px;background:radial-gradient(circle,rgba(201,162,75,.10),transparent 70%);pointer-events:none}
  .ledger .row{display:flex;flex-wrap:wrap;align-items:flex-end;gap:34px;position:relative}
  .ledger .cell{display:flex;flex-direction:column;gap:8px}
  .ledger .cell .lbl{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint)}
  .ledger .cell .v{font-family:var(--disp);font-size:clamp(28px,3.4vw,42px);font-weight:600;letter-spacing:-.03em;line-height:1}
  .ledger .cell.sub .v{font-family:var(--num);font-size:clamp(17px,2vw,21px);color:var(--muted);font-weight:500}
  .ledger .div{align-self:stretch;width:1px;background:var(--line);margin:4px 0}
  .ledger .v.pos{color:var(--pos)} .ledger .v.neg{color:var(--neg)}
  .delta{display:inline-flex;align-items:center;gap:6px;font-family:var(--num);font-size:13px;font-weight:500;padding:4px 10px;border-radius:999px;width:fit-content}
  .delta.pos{background:var(--pos-soft);color:var(--pos)} .delta.neg{background:var(--neg-soft);color:var(--neg)}
  .delta svg{width:12px;height:12px}

  .grid{display:grid;gap:18px}
  .g-2{grid-template-columns:1.5fr 1fr}
  .g-3{grid-template-columns:repeat(3,1fr)}
  @media(max-width:920px){.g-2,.g-3{grid-template-columns:1fr}}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px 22px}
  .card h3{margin:0 0 2px;font-size:14px;font-weight:600;letter-spacing:-.01em}
  .card .sub{color:var(--faint);font-size:12px;margin-bottom:16px}
  .card-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:14px;gap:10px}
  .card-head h3{margin:0}

  /* portfolio cards */
  .pf-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(255px,1fr));gap:16px}
  .pf-card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:17px 18px;cursor:pointer;transition:.14s}
  .pf-card:hover{border-color:var(--line-2);transform:translateY(-2px)}
  .pf-card .h{display:flex;align-items:center;gap:10px;margin-bottom:14px}
  .pf-card .h b{font-weight:600;font-size:14px}
  .pf-card .amt{font-family:var(--disp);font-size:23px;font-weight:600;letter-spacing:-.02em}
  .pf-card .meta{display:flex;justify-content:space-between;align-items:center;margin-top:8px;font-size:12px;color:var(--muted)}
  .pf-card .spark{margin-top:12px}

  /* donut + legend */
  .donut-wrap{display:flex;align-items:center;gap:22px;flex-wrap:wrap}
  .donut-c{position:relative;flex:none}
  .donut-c .mid{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
  .donut-c .mid b{font-family:var(--num);font-size:16px;font-weight:600;letter-spacing:-.02em}
  .donut-c .mid span{font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--faint)}
  .legend{display:flex;flex-direction:column;gap:10px;font-size:13px;flex:1;min-width:140px}
  .legend .li{display:flex;align-items:center;gap:9px}
  .legend .li .sw{width:9px;height:9px;border-radius:3px;flex:none}
  .legend .li .nm{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .legend .li .vl{font-family:var(--num);color:var(--muted)}

  /* allocation bars */
  .alloc{display:flex;flex-direction:column;gap:15px}
  .alloc-row{display:flex;flex-direction:column;gap:6px}
  .alloc-row .top{display:flex;justify-content:space-between;align-items:baseline;font-size:13px;gap:8px}
  .alloc-row .top .nm{display:flex;align-items:center;gap:9px;font-weight:500}
  .alloc-row .sw{width:9px;height:9px;border-radius:3px;flex:none}
  .alloc-row .top .pc{font-family:var(--num);font-weight:500;white-space:nowrap}
  .alloc-row .top .pc small{color:var(--faint);font-weight:400}
  .bar{height:7px;border-radius:99px;background:var(--bg-2);position:relative;overflow:visible}
  .bar i{position:absolute;left:0;top:0;bottom:0;border-radius:99px}
  .bar .tgt{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink);opacity:.6;border-radius:2px}
  .reb{font-size:11.5px;font-family:var(--num);margin-top:1px}
  .reb.buy{color:var(--pos)} .reb.sell{color:var(--neg)} .reb.ok{color:var(--faint)}

  /* instrument rows */
  .inst-row{display:flex;align-items:center;gap:14px;padding:13px 15px;border:1px solid var(--line);border-radius:13px;margin-bottom:9px;transition:.12s;background:var(--surface)}
  .inst-row:hover{border-color:var(--line-2)}
  .inst-row .ic{width:36px;height:36px;border-radius:9px;flex:none;display:flex;align-items:center;justify-content:center;font-family:var(--num);font-weight:600;font-size:12px;color:#0d0d0d}
  .inst-row .nm{min-width:0}
  .inst-row .nm b{display:block;font-weight:600;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .inst-row .nm span{font-size:11.5px;color:var(--faint);display:flex;gap:7px;align-items:center}
  .tag{font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;padding:1px 6px;border-radius:5px;background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}
  .tag.live{color:var(--pos)} .tag.man{color:var(--gold-2)}
  .inst-row .spark{margin-left:auto;flex:none}
  .inst-row .fig{text-align:right;min-width:120px;flex:none}
  .inst-row .fig b{font-family:var(--num);font-weight:600;font-size:14.5px;display:block}
  .inst-row .fig .g{font-family:var(--num);font-size:11.5px}
  .inst-row .fig .g.pos{color:var(--pos)} .inst-row .fig .g.neg{color:var(--neg)}
  .inst-row .edit{width:30px;height:30px;border-radius:8px;display:inline-flex;align-items:center;justify-content:center;color:var(--faint);flex:none}
  .inst-row .edit:hover{background:var(--surface-2);color:var(--ink)}
  .inst-row .edit svg{width:16px;height:16px}

  /* tables */
  table{width:100%;border-collapse:collapse}
  th{font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--faint);font-weight:600;text-align:right;padding:0 10px 11px;border-bottom:1px solid var(--line)}
  th:first-child{text-align:left;padding-left:0}
  td{padding:12px 10px;border-bottom:1px solid var(--line);text-align:right;font-family:var(--num);font-size:13px}
  td:first-child{text-align:left;font-family:var(--ui);padding-left:0}
  tr:last-child td{border-bottom:none}
  td.pos{color:var(--pos)} td.neg{color:var(--neg)}

  .empty{text-align:center;padding:44px 20px;color:var(--muted);border:1px dashed var(--line-2);border-radius:14px}
  .empty svg{width:30px;height:30px;color:var(--faint);margin-bottom:12px}
  .empty p{margin:0 0 16px}

  /* class chips manager */
  .cls-list{display:flex;flex-direction:column;gap:2px}
  .cls-row{display:flex;align-items:center;gap:13px;padding:12px 14px;border:1px solid var(--line);border-radius:12px;margin-bottom:8px;background:var(--surface)}
  .cls-row .sw{width:13px;height:13px;border-radius:4px;flex:none}
  .cls-row .nm{flex:1;font-weight:500}
  .cls-row .tgt{font-family:var(--num);color:var(--muted);font-size:13px}
  .cls-row input{width:70px;padding:6px 8px;border:1px solid var(--line-2);border-radius:8px;background:var(--bg-2);text-align:right;font-family:var(--num)}
  .del-x{width:34px;height:34px;border-radius:9px;display:inline-flex;align-items:center;justify-content:center;color:var(--neg);border:1px solid var(--line-2);flex:none;background:var(--surface);transition:.12s}
  .del-x:hover{background:var(--neg-soft);border-color:var(--neg)}
  .del-x svg{width:17px;height:17px}
  .pf-card.muted{opacity:.58}
  .range-tabs{display:flex;gap:3px;background:var(--bg-2);border:1px solid var(--line);border-radius:10px;padding:3px;width:100%}
  .rt-btn{flex:1;text-align:center;padding:6px 4px;border-radius:7px;font-size:11.5px;font-weight:600;color:var(--muted);font-family:var(--num)}
  .rt-btn.on{background:var(--surface-2);color:var(--ink)}
  .rt-btn:hover{color:var(--ink)}
  .chart-host{position:relative;width:100%}
  .chart-host svg{display:block;width:100%;height:auto;touch-action:pan-y}
  .cvline{position:absolute;top:4px;bottom:24px;width:1px;background:var(--line-2);pointer-events:none;z-index:3}
  .cdot{position:absolute;width:11px;height:11px;border-radius:50%;border:2px solid var(--surface);pointer-events:none;z-index:4;transform:translate(-50%,-50%);box-shadow:0 0 0 1px rgba(0,0,0,.25)}
  .ctip{position:absolute;pointer-events:none;background:var(--surface-2);border:1px solid var(--line-2);border-radius:10px;padding:8px 11px;box-shadow:0 10px 28px rgba(0,0,0,.45);transform:translate(-50%,calc(-100% - 12px));white-space:nowrap;z-index:6}
  .ctip .d{color:var(--faint);font-size:10.5px;margin-bottom:3px}
  .ctip .v{font-family:var(--num);font-weight:600;font-size:14px}
  .ctip .i{font-family:var(--num);color:var(--muted);font-size:11px;margin-top:2px}
  .chart-legend{display:flex;gap:16px;align-items:center;margin-top:12px;font-size:12px;color:var(--muted);flex-wrap:wrap}
  .chart-legend i{display:inline-block;width:15px;height:3px;border-radius:2px;vertical-align:middle;margin-right:6px}
  .chart-legend i.dash{height:0;border-top:2px dashed var(--muted);background:none;border-radius:0}
  .chart-legend .stat{margin-left:auto;font-family:var(--num);font-weight:600}
  .chart-legend .stat.pos{color:var(--pos)} .chart-legend .stat.neg{color:var(--neg)}

  /* modal */
  .ov{position:fixed;inset:0;background:rgba(6,10,8,.6);backdrop-filter:blur(3px);display:none;align-items:center;justify-content:center;z-index:60;padding:20px}
  .ov.on{display:flex}
  .modal{background:var(--surface);border:1px solid var(--line-2);border-radius:18px;width:min(460px,100%);padding:24px;box-shadow:0 30px 70px rgba(0,0,0,.5);max-height:90vh;overflow-y:auto}
  .modal h3{margin:0 0 4px;font-family:var(--disp);font-size:19px;font-weight:600;letter-spacing:-.02em}
  .modal .msub{color:var(--muted);font-size:12.5px;margin-bottom:18px}
  .field{margin-bottom:13px}
  .field label{display:block;font-size:12px;color:var(--muted);margin-bottom:6px;font-weight:500}
  .field input,.field select{width:100%;padding:11px 13px;border:1px solid var(--line-2);border-radius:10px;background:var(--bg-2);outline:none}
  .field input:focus,.field select:focus{border-color:var(--gold)}
  .field.num input{font-family:var(--num)}
  .frow{display:flex;gap:11px}.frow>*{flex:1}
  .seg{display:flex;gap:7px;margin-bottom:16px;flex-wrap:wrap}
  .seg button{flex:1;min-width:80px;padding:10px;border:1px solid var(--line-2);border-radius:10px;background:var(--bg-2);font-size:12.5px;font-weight:500;color:var(--muted)}
  .seg button.on{border-color:var(--gold);color:var(--ink);background:var(--gold-soft)}
  .modal-foot{display:flex;gap:10px;justify-content:space-between;align-items:center;margin-top:22px}
  .modal-foot .rt{display:flex;gap:10px;margin-left:auto}
  .search-res{max-height:210px;overflow-y:auto;border:1px solid var(--line);border-radius:10px;margin-top:-4px}
  .sr{display:flex;align-items:center;gap:11px;padding:10px 12px;cursor:pointer;border-bottom:1px solid var(--line)}
  .sr:last-child{border-bottom:none}
  .sr:hover{background:var(--surface-2)}
  .sr img{width:22px;height:22px;border-radius:50%}
  .sr .tk{font-family:var(--num);font-size:11px;color:var(--faint)}
  .sr b{font-size:13px;font-weight:600}
  .picked{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--gold);background:var(--gold-soft);border-radius:10px;font-size:13px;margin-bottom:13px}
  .picked .x{margin-left:auto;color:var(--muted);cursor:pointer}

  .toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--surface-2);border:1px solid var(--line-2);color:var(--ink);padding:11px 18px;border-radius:11px;font-size:13px;opacity:0;transition:.25s;z-index:70;pointer-events:none;box-shadow:0 10px 30px rgba(0,0,0,.4)}
  .toast.on{opacity:1;transform:translateX(-50%) translateY(0)}

  .hint-box{font-size:12px;color:var(--muted);background:var(--bg-2);border:1px solid var(--line);border-radius:10px;padding:11px 13px;line-height:1.5}

  @media(max-width:760px){
    .shell{grid-template-columns:1fr}
    .side{position:static;height:auto;border-right:none;border-bottom:1px solid var(--line)}
    .main{padding:18px 16px 60px}
    .ledger .div{display:none}
    .inst-row .spark{display:none}
  }
</style>
</head>
<body>

<!-- ===================== LOGIN ===================== -->
<div id="lock">

      auto.filter(i=>i.provider==='coingecko').forEach(i=>{ const p=j[i.symbol]?.pln; if(p){ i.lastPrice=p; i.lastCur='PLN'; i.lastAt=Date.now(); } });
    }catch(e){ ok=false; }
  }
  // --- Twelve Data (akcje / metale / GPW) ---
  const td=auto.filter(i=>i.provider==='twelvedata');
  if(td.length){
    const key=DATA.settings.twelveKey;
    if(!key){ if(!silent) toast('Dodaj darmowy klucz Twelve Data w Ustawieniach, by pobrać ceny akcji i metali'); }
    else{
      const noEx=td.filter(i=>!i.exchange), withEx=td.filter(i=>i.exchange);
      for(let k=0;k<noEx.length;k+=20){
        const chunk=noEx.slice(k,k+20); const syms=[...new Set(chunk.map(i=>i.symbol))].join(',');
        try{
          const r=await fetch('https://api.twelvedata.com/quote?symbol='+encodeURIComponent(syms)+'&apikey='+encodeURIComponent(key));
          const j=await r.json(); applyTd(chunk,j);
        }catch(e){ ok=false; }
      }
      for(const i of withEx){
        try{
          const r=await fetch('https://api.twelvedata.com/quote?symbol='+encodeURIComponent(i.symbol)+'&exchange='+encodeURIComponent(i.exchange)+'&apikey='+encodeURIComponent(key));
          const j=await r.json(); applyTd([i],j);
        }catch(e){ ok=false; }
      }
    }
  }
  snapshotHistory();
  await save(); render(); setLive(ok?'on':'err');
  refreshing=false;
}
function applyTd(items,j){
  const get=sym=> (j && j[sym]) ? j[sym] : (j && j.symbol===sym ? j : (items.length===1&&j&&j.close?j:null));
  items.forEach(i=>{
    const q=get(i.symbol);
    if(q && q.close && !q.code){ i.lastPrice=parseFloat(q.close); i.lastCur=q.currency||i.currency||'USD'; i.lastAt=Date.now();
      if(typeof q.percent_change!=='undefined') i.dayPct=parseFloat(q.percent_change); }
  });
}
function setLive(state){
  document.querySelectorAll('.live').forEach(el=>{
    el.classList.remove('on','err');
    const t=el.querySelector('.txt');
    if(state==='loading'){ if(t)t.textContent='Odświeżam…'; }
    else if(state==='err'){ el.classList.add('err'); if(t)t.textContent='Częściowo — sprawdź klucze'; }
    else { el.classList.add('on'); if(t)t.textContent='Na żywo'; }

function snapsOf(i){ return (i.snapshots&&i.snapshots.length)?[...i.snapshots].sort((a,b)=>a.date<b.date?-1:1):null; }
function liveValue(i){
  if(i.provider==='fx') return (i.quantity||0)*fxToPln(i.symbol);
  if(i.mode==='auto' && i.lastPrice) return (i.quantity||0)*i.lastPrice*fxToPln(i.lastCur||i.currency||'PLN');
  return null;
}
function instValue(i){
  const lv=liveValue(i); if(lv!=null) return lv;
  const s=snapsOf(i); if(s) return s[s.length-1].value||0;
  return i.manualValue||0;
}
function instInvested(i){
  const s=snapsOf(i); if(s){ const li=s[s.length-1].invested; return li!=null?li:(i.invested||0); }
  return i.invested||0;
}
const pfInstruments = pfId => DATA.instruments.filter(i=>i.portfolioId===pfId);
const isHidden = pfId => { const p=DATA.portfolios.find(x=>x.id===pfId); return !!(p&&p.hidden); };

function pfTotals(pfId){
  const list = pfId ? pfInstruments(pfId) : DATA.instruments.filter(i=>!isHidden(i.portfolioId));
  let val=0, inv=0, cash=0;
  list.forEach(i=>{ const v=instValue(i); val+=v; inv+=instInvested(i);
    if(i.classId==='gotowka') cash+=v; });
  return {value:val, invested:inv, profit:val-inv, gpct:inv?(val-inv)/inv*100:0, cash, count:list.length};
}
function classBreakdown(pfId){
  const list = pfId ? pfInstruments(pfId) : DATA.instruments.filter(i=>!isHidden(i.portfolioId));
  const map={};
  list.forEach(i=>{ map[i.classId]=(map[i.classId]||0)+instValue(i); });
  const total=Object.values(map).reduce((a,b)=>a+b,0)||1;
  return DATA.classes.filter(c=>map[c.id]).map(c=>({...c, value:map[c.id], pctNow:map[c.id]/total*100}))
    .sort((a,b)=>b.value-a.value);
}
function snapshotHistory(){ recordToday(); }
function recordToday(){
  const td=today();
  DATA.instruments.forEach(i=>{ const lv=liveValue(i); if(lv==null) return;
    if(!i.snapshots) i.snapshots=[];
    const last=i.snapshots[i.snapshots.length-1];
    if(last&&last.date===td){ last.value=lv; last.invested=i.invested||last.invested||0; }
    else i.snapshots.push({date:td,value:lv,invested:i.invested||0}); });
}
function timeline(pfId){
  const scope=DATA.instruments.filter(i=> pfId ? i.portfolioId===pfId : !isHidden(i.portfolioId));
  const dset=new Set(); scope.forEach(i=>{ const s=snapsOf(i); if(s) s.forEach(x=>dset.add(x.date)); });
  const dates=[...dset].sort();
  const out=dates.map(d=>{ let v=0,inv=0;
    scope.forEach(i=>{ const s=snapsOf(i); if(!s) return; const past=s.filter(x=>x.date<=d);
      if(past.length){ const l=past[past.length-1]; v+=l.value||0; inv+=(l.invested||0); } });
    return {date:d,value:v,invested:inv}; });
  const td=today(); let v=0,inv=0; scope.forEach(i=>{ v+=instValue(i); inv+=instInvested(i); });
  if(out.length && out[out.length-1].date===td) out[out.length-1]={date:td,value:v,invested:inv};
  else out.push({date:td,value:v,invested:inv});
  return out;
}
const histOf = key => timeline(key==='total'?null:key);

function lineChart(series,{w=560,h=190,color='var(--gold)'}={}){
  if(series.length<2) return `<div class="empty" style="padding:34px"><p>Historia zbuduje się z czasem — przy każdym odświeżeniu cen zapisuję punkt wartości.</p></div>`;
  const pad={l:8,r:8,t:16,b:24};
  const xs=series.map(p=>new Date(p.date).getTime()), ys=series.map(p=>p.value);
  const xmin=Math.min(...xs),xmax=Math.max(...xs),ymin=Math.min(...ys),ymax=Math.max(...ys),yr=(ymax-ymin)||1;
  const X=t=>pad.l+(xmax===xmin?0:(t-xmin)/(xmax-xmin))*(w-pad.l-pad.r);
  const Y=v=>h-pad.b-((v-ymin)/yr)*(h-pad.t-pad.b);
  const pts=series.map(p=>[X(new Date(p.date).getTime()),Y(p.value)]);
  const line=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
  const area=line+` L ${pts[pts.length-1][0].toFixed(1)} ${h-pad.b} L ${pts[0][0].toFixed(1)} ${h-pad.b} Z`;
  const lp=pts[pts.length-1];
  return `<svg viewBox="0 0 ${w} ${h}" width="100%" preserveAspectRatio="none" style="display:block">
    <defs><linearGradient id="fg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${color}" stop-opacity=".22"/><stop offset="1" stop-color="${color}" stop-opacity="0"/></linearGradient></defs>
    <line x1="${pad.l}" y1="${h-pad.b}" x2="${w-pad.r}" y2="${h-pad.b}" stroke="var(--line)"/>
    <path d="${area}" fill="url(#fg)"/>
    <path d="${line}" fill="none" stroke="${color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="${lp[0]}" cy="${lp[1]}" r="3.4" fill="${color}"/>
    <text x="${pad.l}" y="${h-7}" font-size="10" fill="var(--faint)" font-family="var(--num)">${fmtDate(series[0].date)}</text>
    <text x="${w-pad.r}" y="${h-7}" font-size="10" fill="var(--faint)" text-anchor="end" font-family="var(--num)">${fmtDate(series[series.length-1].date)}</text>
  </svg>`;
}
function donut(parts,size=150,thick=22){
  const total=parts.reduce((s,p)=>s+p.value,0)||1,r=(size-thick)/2,c=2*Math.PI*r;let off=0;
  const segs=parts.map(p=>{const len=p.value/total*c;
    const s=`<circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${p.color}" stroke-width="${thick}"
      stroke-dasharray="${len.toFixed(2)} ${(c-len).toFixed(2)}" stroke-dashoffset="${(-off).toFixed(2)}"
      transform="rotate(-90 ${size/2} ${size/2})"/>`;off+=len;return s;}).join('');
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}"><circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="var(--bg-2)" stroke-width="${thick}"/>${segs}</svg>`;
}
function spark(series,{w=110,h=34,color}={}){
  const s=series.map(p=>p.value); if(s.length<2) return `<svg width="${w}" height="${h}"></svg>`;
  const mn=Math.min(...s),mx=Math.max(...s),r=(mx-mn)||1;
  const pts=s.map((v,i)=>`${(i/(s.length-1)*w).toFixed(1)},${(h-2-((v-mn)/r)*(h-4)).toFixed(1)}`).join(' ');
  const up=s[s.length-1]>=s[0]; const col=color||(up?'var(--pos)':'var(--neg)');
  return `<svg width="${w}" height="${h}"><polyline points="${pts}" fill="none" stroke="${col}" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round"/></svg>`;
}

const RANGES=[{k:'1T',l:'1T',d:7},{k:'1M',l:'1M',d:31},{k:'3M',l:'3M',d:92},{k:'6M',l:'6M',d:183},{k:'1R',l:'1R',d:366},{k:'5L',l:'5L',d:1827},{k:'max',l:'Max',d:1e9}];
let chartRange='max';
const PLM=['sty','lut','mar','kwi','maj','cze','lip','sie','wrz','paź','lis','gru'];
function fmtTick(ms,spanDays){ const d=new Date(ms);
  if(spanDays<=120) return d.getDate()+' '+PLM[d.getMonth()];
  return PLM[d.getMonth()]+" '"+String(d.getFullYear()).slice(2); }
function filterRange(arr){
  if(chartRange==='max') return arr;
  const r=RANGES.find(x=>x.k===chartRange); const cut=Date.now()-r.d*864e5;
  const inWin=arr.filter(p=>+new Date(p.date)>=cut);
  const before=arr.filter(p=>+new Date(p.date)<cut);
  const anchored=(before.length?[before[before.length-1]]:[]).concat(inWin);
  return anchored.length>=2?anchored:arr.slice(-2);
}
let CHART=null;
function buildChart(series,color){
  const W=600,H=234,pad={l:8,r:8,t:16,b:26};
  if(series.length<2){ CHART=null; return `<div class="empty" style="padding:34px"><p>Historia zbiera się od dziś — za kilka dni pojawi się wykres, a dłuższe zakresy (6M, 1R, 5L) wypełnią się z czasem.</p></div>`; }
  const xs=series.map(p=>+new Date(p.date));
  const allv=[]; series.forEach(p=>{allv.push(p.value); allv.push(p.invested==null?p.value:p.invested);});
  let ymin=Math.min(...allv),ymax=Math.max(...allv); if(ymin===ymax){ymin=ymin*0.98;ymax=ymax*1.02+1;}
  const yr=(ymax-ymin)||1, xmin=Math.min(...xs),xmax=Math.max(...xs);
  const X=t=>pad.l+(xmax===xmin?0:(t-xmin)/(xmax-xmin))*(W-pad.l-pad.r);
  const Y=v=>H-pad.b-((v-ymin)/yr)*(H-pad.t-pad.b);
  const pts=series.map((p,i)=>({date:p.date,value:p.value,invested:(p.invested==null?p.value:p.invested),x:X(xs[i]),y:Y(p.value),ms:xs[i]}));
  const grid=[]; const yl=4;
  for(let i=0;i<yl;i++){ const v=ymin+yr*i/(yl-1), y=Y(v);
    grid.push(`<line x1="${pad.l}" y1="${y.toFixed(1)}" x2="${W-pad.r}" y2="${y.toFixed(1)}" stroke="var(--line)" opacity="${i===0?'.7':'.4'}"/>`);
    grid.push(`<text x="${pad.l+3}" y="${(y-4).toFixed(1)}" font-size="9.5" fill="var(--faint)" font-family="var(--num)">${fmtShort(v)}</text>`); }
  const spanDays=(xmax-xmin)/864e5;
  const n=Math.min(5,Math.max(2,series.length)), xt=[];
  for(let i=0;i<n;i++){ const t=xmin+(xmax-xmin)*i/(n-1), x=X(t), anc=i===0?'start':(i===n-1?'end':'middle');
    xt.push(`<line x1="${x.toFixed(1)}" y1="${pad.t}" x2="${x.toFixed(1)}" y2="${H-pad.b}" stroke="var(--line)" opacity=".2"/>`);
    xt.push(`<text x="${x.toFixed(1)}" y="${H-9}" font-size="9.5" fill="var(--faint)" font-family="var(--num)" text-anchor="${anc}">${fmtTick(t,spanDays)}</text>`); }
  const valLine=pts.map((p,i)=>(i?'L':'M')+p.x.toFixed(1)+' '+p.y.toFixed(1)).join(' ');
  const invLine=pts.map((p,i)=>(i?'L':'M')+p.x.toFixed(1)+' '+Y(p.invested).toFixed(1)).join(' ');
  const area=valLine+` L ${X(xmax).toFixed(1)} ${H-pad.b} L ${X(xmin).toFixed(1)} ${H-pad.b} Z`;
  const last=pts[pts.length-1];
  CHART={pts,W,H,color};
  return `<svg viewBox="0 0 ${W} ${H}">
    <defs><linearGradient id="fg2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${color}" stop-opacity=".18"/><stop offset="1" stop-color="${color}" stop-opacity="0"/></linearGradient></defs>
    ${grid.join('')}${xt.join('')}
    <path d="${area}" fill="url(#fg2)"/>
    <path d="${invLine}" fill="none" stroke="var(--muted)" stroke-width="1.4" stroke-dasharray="5 4"/>
    <path d="${valLine}" fill="none" stroke="${color}" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="${last.x.toFixed(1)}" cy="${last.y.toFixed(1)}" r="3.4" fill="${color}"/>
  </svg>`;
}
function chartMove(e){
  const host=e.target.closest && e.target.closest('.chart-host');
  if(!host||!CHART){ document.querySelectorAll('.ctip,.cvline,.cdot').forEach(el=>el.style.display='none'); return; }
  const svg=host.querySelector('svg'); if(!svg) return;
  const r=svg.getBoundingClientRect(); if(!r.width) return;
  const cx=(e.touches&&e.touches[0]?e.touches[0].clientX:e.clientX);
  const pts=CHART.pts;
  let vbX=(cx-r.left)/r.width*CHART.W;
  vbX=Math.max(pts[0].x, Math.min(pts[pts.length-1].x, vbX));
  let j=1; while(j<pts.length-1 && pts[j].x<vbX) j++;
  const p0=pts[j-1], p1=pts[j];
  const tt=(p1.x===p0.x)?0:(vbX-p0.x)/(p1.x-p0.x);
  const ms=p0.ms+(p1.ms-p0.ms)*tt, value=p0.value+(p1.value-p0.value)*tt,
        invested=p0.invested+(p1.invested-p0.invested)*tt, yv=p0.y+(p1.y-p0.y)*tt;
  const px=vbX/CHART.W*r.width, py=yv/CHART.H*r.height;
  const tip=host.querySelector('.ctip'), vline=host.querySelector('.cvline'), dot=host.querySelector('.cdot');
  const g=value-invested;
  if(tip){ tip.style.display='block'; tip.innerHTML=`<div class="d">${fmtDate(ms)}</div><div class="v">${fmt(value)}</div><div class="i">wpłacone ${fmt(invested)} · <span style="color:${g>=0?'var(--pos)':'var(--neg)'}">${g>=0?'+':''}${fmt(g)}</span></div>`;
    const tw=tip.offsetWidth||150; const lx=Math.max(tw/2+4,Math.min(r.width-tw/2-4,px)); tip.style.left=lx+'px'; tip.style.top=Math.max(2,py)+'px'; }
  if(vline){ vline.style.display='block'; vline.style.left=px+'px'; }
  if(dot){ dot.style.display='block'; dot.style.left=px+'px'; dot.style.top=py+'px'; dot.style.background=CHART.color; }
}

      <button class="btn ghost sm" data-action="editpf" data-pf="${pfId}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.1 2.1 0 0 1 3 3L12 15l-4 1 1-4Z"/></svg>Edytuj</button>
      <button class="btn ghost" data-action="refresh"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.6-6.4"/><path d="M21 3v6h-6"/></svg>Odśwież</button>
      <button class="btn pr" data-action="addinst" data-pf="${pfId}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>Dodaj</button>
    </div>
  </div>
  <div class="ledger"><div class="row">
    <div class="cell"><span class="lbl">Wartość portfela</span><span class="v">${fmt(t.value)}</span>${deltaChip(t.gpct)}</div>
    <div class="div"></div>
    <div class="cell sub"><span class="lbl">Wpłacone</span><span class="v">${fmt(t.invested)}</span></div>
    <div class="cell sub"><span class="lbl">Gotówka</span><span class="v">${fmt(t.cash)}</span></div>
    <div class="cell sub"><span class="lbl">Zysk / strata</span><span class="v ${t.profit>=0?'pos':'neg'}">${fmt(t.profit)}</span></div>
  </div></div>
  ${body}`;
  setLive('on');
}

let pick=null; // wybrany instrument z wyszukiwarki

function modalAddInst(pfId){
  pick=null;

        <div class="field num"><label>Ilość (uncje troy)</label><input id="i-qty" inputmode="decimal" placeholder="np. 2"></div>
        <div class="field num"><label>Wpłacone / koszt (zł)</label><input id="i-inv" inputmode="decimal" placeholder="np. 14000"></div>

    return;
  }
  if(type==='waluta'){

      </div>

    return;

async function searchCrypto(q){
  const box=document.getElementById('i-searchres'); if(!q||q.length<2){box.innerHTML='';return;}
  box.innerHTML=`<div class="search-res"><div class="sr">Szukam…</div></div>`;
  try{
    const key=DATA.settings.geckoKey?('&x_cg_demo_api_key='+encodeURIComponent(DATA.settings.geckoKey)):'';
    const r=await fetch('https://api.coingecko.com/api/v3/search?query='+encodeURIComponent(q)+key);
    const j=await r.json(); const coins=(j.coins||[]).slice(0,8);
    box.innerHTML=`<div class="search-res">${coins.map(c=>`<div class="sr" data-pick='${esc(JSON.stringify({provider:'coingecko',symbol:c.id,name:c.name,currency:'PLN'}))}'>
      ${c.thumb?`<img src="${c.thumb}">`:''}<div><b>${esc(c.name)}</b> <span class="tk">${esc((c.symbol||'').toUpperCase())}</span></div></div>`).join('')||'<div class="sr">Brak wyników</div>'}</div>`;
  }catch(e){ box.innerHTML=`<div class="hint-box">Nie udało się wyszukać. Spróbuj ponownie.</div>`; }
}
async function searchStock(q){
  const box=document.getElementById('i-searchres'); if(!q||q.length<1){box.innerHTML='';return;}
  const key=DATA.settings.twelveKey;
  if(!key){ box.innerHTML=`<div class="hint-box">Aby wyszukiwać akcje, dodaj klucz Twelve Data w Ustawieniach. Możesz też wpisać sam ticker (np. AAPL) i dodać — cena pobierze się przy odświeżeniu.</div>
    <div class="sr" data-pick='${esc(JSON.stringify({provider:'twelvedata',symbol:q.toUpperCase(),name:q.toUpperCase(),currency:'USD',exchange:''}))}'>Użyj „<b>${esc(q.toUpperCase())}</b>" jako ticker</div>`; return; }
  box.innerHTML=`<div class="search-res"><div class="sr">Szukam…</div></div>`;
  try{
    const r=await fetch('https://api.twelvedata.com/symbol_search?symbol='+encodeURIComponent(q)+'&outputsize=10&apikey='+encodeURIComponent(key));
    const j=await r.json(); const d=(j.data||[]).slice(0,9);
    box.innerHTML=`<div class="search-res">${d.map(x=>`<div class="sr" data-pick='${esc(JSON.stringify({provider:'twelvedata',symbol:x.symbol,name:x.instrument_name||x.symbol,currency:x.currency||'USD',exchange:x.exchange||''}))}'>
      <div><b>${esc(x.symbol)}</b> <span class="tk">${esc((x.instrument_name||'').slice(0,34))}</span><br><span class="tk">${esc(x.exchange||'')} · ${esc(x.currency||'')}</span></div></div>`).join('')||'<div class="sr">Brak wyników</div>'}</div>`;
  }catch(e){ box.innerHTML=`<div class="hint-box">Nie udało się wyszukać.</div>`; }
}
function choosePick(obj){
  pick=obj;
  document.getElementById('i-searchres').innerHTML='';
  document.getElementById('i-picked').innerHTML=`<div class="picked"><span>✓ ${esc(obj.name)} <span class="tk num">${esc(obj.symbol)}${obj.exchange?' · '+esc(obj.exchange):''}</span></span><span class="x" data-action="unpick">zmień</span></div>`;
  const nm=document.getElementById('i-search'); if(nm) nm.value=obj.name;
}

function modalEditInst(id){
  const i=DATA.instruments.find(x=>x.id===id); if(!i) return;
  const auto=i.mode==='auto';
  openModal(`<h3>Edytuj pozycję</h3><div class="msub">${auto?'<span class="tag live">na żywo</span> '+esc(i.symbol):'<span class="tag man">ręczne</span>'}</div>
    <div class="field"><label>Nazwa</label><input id="e-name" value="${esc(i.name)}"></div>
    ${auto?`<div class="frow"><div class="field num"><label>Ilość</label><input id="e-qty" inputmode="decimal" value="${i.quantity||0}"></div>
      <div class="field num"><label>Wpłacone / koszt (zł)</label><input id="e-inv" inputmode="decimal" value="${i.invested||0}"></div></div>`
    :`<div class="frow"><div class="field num"><label>Aktualna wartość (zł)</label><input id="e-val" inputmode="decimal" value="${i.manualValue||0}"></div>
      <div class="field num"><label>Wpłacone / koszt (zł)</label><input id="e-inv" inputmode="decimal" value="${i.invested||0}"></div></div>`}
    <div class="frow"><div class="field"><label>Portfel</label><select id="e-pf">${pfOptions(i.portfolioId)}</select></div>
      <div class="field"><label>Klasa</label><select id="e-class">${classOptions(i.classId)}</select></div></div>
    <div class="modal-foot"><button class="btn danger" data-action="delinst" data-id="${id}">Usuń</button>
      <div class="rt"><button class="btn ghost" data-action="closemodal">Anuluj</button><button class="btn pr" data-action="saveedit" data-id="${id}">Zapisz</button></div></div>`);
}

function modalPf(pfId){
  const p=pfId?DATA.portfolios.find(x=>x.id===pfId):null;
  openModal(`<h3>${p?'Edytuj portfel':'Nowy portfel'}</h3>
    <div class="field"><label>Nazwa</label><input id="pf-name" placeholder="np. Polska, US Dywidendy, Krypto" value="${p?esc(p.name):''}"></div>
    <div class="frow"><div class="field"><label>Skrót (2 litery)</label><input id="pf-badge" maxlength="2" placeholder="PL" value="${p?esc(p.badge||''):''}"></div>
      <div class="field"><label>Kolor</label><input id="pf-color" type="color" value="${p?p.color:'#C9A24B'}" style="height:44px;padding:4px"></div></div>
    <label style="display:flex;align-items:center;gap:9px;margin:6px 0 2px;font-size:13px;color:var(--muted);cursor:pointer">
      <input type="checkbox" id="pf-inmajatek" ${(!p||!p.hidden)?'checked':''} style="width:18px;height:18px;accent-color:var(--gold)">
      Wliczaj do majątku <span style="color:var(--faint)">(odznacz np. dla poduchy)</span></label>
    <div class="modal-foot">${p?`<button class="btn danger" data-action="delpf" data-pf="${pfId}">Usuń portfel</button>`:'<span></span>'}
      <div class="rt"><button class="btn ghost" data-action="closemodal">Anuluj</button><button class="btn pr" data-action="savepf" ${p?`data-pf="${pfId}"`:''}>Zapisz</button></div></div>`);
}
function modalClass(){
  openModal(`<h3>Nowa klasa aktywów</h3><div class="msub">Klasa grupuje aktywa i nadaje im kolor na wykresach.</div>
    <div class="frow"><div class="field"><label>Nazwa</label><input id="cl-name" placeholder="np. Obligacje, Surowce, REIT-y"></div>
      <div class="field"><label>Kolor</label><input id="cl-color" type="color" value="#5B8FD6" style="height:44px;padding:4px"></div></div>
    <div class="modal-foot"><button class="btn ghost" data-action="closemodal">Anuluj</button><div class="rt"><button class="btn pr" data-action="saveclass">Dodaj</button></div></div>`);
}
function modalPfTargets(){
  const pfs=DATA.portfolios.filter(p=>!p.hidden);
  const sum=pfs.reduce((a,p)=>a+(+p.target||0),0);
  openModal(`<h3>Cel majątkowy</h3><div class="msub">Jaki % całego majątku ma stanowić każdy portfel. Portfele poza majątkiem (ukryte) nie liczą się i nie ma ich tutaj.</div>
    ${pfs.map(p=>`<div class="field num"><label><span class="pf-badge" style="width:15px;height:15px;display:inline-flex;background:${p.color};vertical-align:-3px;margin-right:5px">${esc(p.badge||'')}</span>${esc(p.name)}</label><input data-pftgt="${p.id}" inputmode="decimal" value="${p.target||0}"></div>`).join('')||'<div class="sub">Brak portfeli w majątku.</div>'}
    <div class="hint-box" id="pftgt-sum">Suma celów: <b class="num">${sum}%</b> <span style="color:var(--faint)">(najlepiej 100%)</span></div>
    <div class="modal-foot"><button class="btn ghost" data-action="closemodal">Anuluj</button><div class="rt"><button class="btn pr" data-action="savepftargets">Zapisz</button></div></div>`);
}
function modalPosTargets(pfId){
  const list=pfInstruments(pfId); const p=DATA.portfolios.find(x=>x.id===pfId);
  const sum=list.reduce((a,i)=>a+(+i.targetPct||0),0);
  openModal(`<h3>Cel portfela — ${esc(p.name)}</h3><div class="msub">Jaki % tego portfela ma stanowić każda pozycja (np. BTC 90%, ETH 5%, LINK 5%).</div>
    ${list.map(i=>`<div class="field num"><label><span class="sw" style="display:inline-block;width:9px;height:9px;border-radius:3px;background:${classColor(i.classId)};margin-right:6px"></span>${esc(i.name)}</label><input data-postgt="${i.id}" inputmode="decimal" value="${i.targetPct||0}"></div>`).join('')||'<div class="sub">Brak pozycji.</div>'}
    <div class="hint-box" id="postgt-sum">Suma celów: <b class="num">${sum}%</b> <span style="color:var(--faint)">(najlepiej 100%)</span></div>
    <div class="modal-foot"><button class="btn ghost" data-action="closemodal">Anuluj</button><div class="rt"><button class="btn pr" data-action="savepostargets" data-pf="${pfId}">Zapisz</button></div></div>`);
}
function modalConfirm(title,msg,action,data){
  openModal(`<h3>${title}</h3><div class="msub" style="font-size:13.5px;color:var(--muted);margin-bottom:2px">${msg}</div>
    <div class="modal-foot"><button class="btn ghost" data-action="closemodal">Anuluj</button><div class="rt"><button class="btn danger" data-action="${action}" ${Object.entries(data||{}).map(([k,v])=>`data-${k}="${esc(v)}"`).join(' ')}>Usuń</button></div></div>`);
}

/* ============================================================
   AKCJE (delegacja)
   ============================================================ */
document.addEventListener('click',async e=>{
  const navBtn=e.target.closest('[data-nav]');
  if(navBtn){ view={screen:navBtn.dataset.nav,pfId:null}; render(); return; }
  const rangeBtn=e.target.closest('[data-range]');
  if(rangeBtn){ chartRange=rangeBtn.dataset.range; render(); return; }
  const pfBtn=e.target.closest('[data-pf]');
  if(pfBtn && !e.target.closest('[data-action]')){ view={screen:'pf',pfId:pfBtn.dataset.pf}; render(); return; }
  const sr=e.target.closest('[data-pick]');
  if(sr){ try{ choosePick(JSON.parse(sr.dataset.pick)); }catch(_){} return; }
  const act=e.target.closest('[data-action]'); if(!act) return;
  const a=act.dataset.action, d=act.dataset;

  if(a==='logout'){ if(supabase) await supabase.auth.signOut(); return; }
  if(a==='closemodal'){ closeModal(); return; }
  if(a==='refresh'){ refreshPrices(false); return; }
  if(a==='unpick'){ pick=null; document.getElementById('i-picked').innerHTML=''; return; }

  if(a==='addinst') return modalAddInst(d.pf||DATA.portfolios[0]?.id);
  if(a==='editinst') return modalEditInst(d.id);
  if(a==='addpf') return modalPf(null);
  if(a==='editpf') return modalPf(d.pf);
  if(a==='togglehide'){ const p=DATA.portfolios.find(x=>x.id===d.pf); if(p){ p.hidden=!p.hidden; await save(); render(); toast(p.hidden?'Portfel poza majątkiem':'Portfel wliczany do majątku'); } return; }
  if(a==='addclass') return modalClass();
  if(a==='editpftargets') return modalPfTargets();
  if(a==='editpostargets') return modalPosTargets(d.pf);

  if(a==='export'){ const blob=new Blob([JSON.stringify(DATA,null,2)],{type:'application/json'});
    const u=URL.createObjectURL(blob); const el=document.createElement('a'); el.href=u; el.download='byk-kopia-'+today()+'.json'; el.click(); URL.revokeObjectURL(u); return; }
  if(a==='importexcel'){ openModal(`<h3>Wczytać dane z Excela?</h3>
    <div class="msub" style="font-size:13.5px;color:var(--muted)">Zastąpi to obecne dane na tym koncie Twoją historią z arkusza (Akcje, Krypto, Lokaty, gotówka/waluty, mieszkanie, garaże, poducha). Klucze API zostaną zachowane. Operacji nie cofniesz — jeśli chcesz, najpierw pobierz kopię.</div>
    <div class="modal-foot"><button class="btn ghost" data-action="closemodal">Anuluj</button><div class="rt"><button class="btn pr" data-action="confirmimportexcel">Wczytaj</button></div></div>`); return; }
  if(a==='confirmimportexcel'){ const keep=(DATA&&DATA.settings)||{};
    DATA=JSON.parse(JSON.stringify(IMPORTED_DATA)); normalizeData();
    DATA.settings.twelveKey=keep.twelveKey||DATA.settings.twelveKey; DATA.settings.geckoKey=keep.geckoKey||DATA.settings.geckoKey;
    await save(); closeModal(); view={screen:'wealth',pfId:null}; render(); toast('Wczytano dane z Excela'); refreshPrices(true); return; }

  if(a==='saveinst'){
    const pf=document.getElementById('i-pf').value, cls=document.getElementById('i-class').value;
    const inv=parseNum(document.getElementById('i-inv')?.value);
    if(d.mode==='manual'){
      const name=document.getElementById('i-name').value.trim(); if(!name) return toast('Podaj nazwę');
      DATA.instruments.push({id:uid('i_'),portfolioId:pf,classId:cls,name,mode:'manual',manualValue:parseNum(document.getElementById('i-val').value),invested:inv});
    } else if(d.kind==='metal'){
      const sym=document.getElementById('i-metal').value;
      const name=(document.getElementById('i-name').value.trim())||sym;
      DATA.instruments.push({id:uid('i_'),portfolioId:pf,classId:cls,name,mode:'auto',provider:'twelvedata',symbol:sym,exchange:'',currency:'USD',quantity:parseNum(document.getElementById('i-qty').value),invested:inv});
    } else if(d.kind==='waluta'){
      const cur=document.getElementById('i-cur').value;
      const name=(document.getElementById('i-name').value.trim())||(cur+' — gotówka');
      DATA.instruments.push({id:uid('i_'),portfolioId:pf,classId:cls,name,mode:'auto',provider:'fx',symbol:cur,exchange:'',currency:cur,quantity:parseNum(document.getElementById('i-qty').value),invested:inv,lastPrice:1,lastCur:cur,lastAt:Date.now()});
    } else {
      if(!pick) return toast('Wyszukaj i wybierz walor z listy');
      DATA.instruments.push({id:uid('i_'),portfolioId:pf,classId:cls,name:pick.name,mode:'auto',provider:pick.provider,symbol:pick.symbol,exchange:pick.exchange||'',currency:pick.currency||'PLN',quantity:parseNum(document.getElementById('i-qty').value),invested:inv});
    }
    await save(); closeModal(); view={screen:'pf',pfId:pf}; render(); toast('Dodano — odświeżam ceny'); refreshPrices(true);
    return;
  }
  if(a==='saveedit'){
    const i=DATA.instruments.find(x=>x.id===d.id); if(!i) return;
    i.name=document.getElementById('e-name').value.trim()||i.name;
    i.invested=parseNum(document.getElementById('e-inv').value);
    i.portfolioId=document.getElementById('e-pf').value; i.classId=document.getElementById('e-class').value;
    if(i.mode==='auto') i.quantity=parseNum(document.getElementById('e-qty').value);
    else { const nv=parseNum(document.getElementById('e-val').value); i.manualValue=nv;
      if(!i.snapshots) i.snapshots=[]; const td=today(); const last=i.snapshots[i.snapshots.length-1];
      if(last&&last.date===td){ last.value=nv; last.invested=i.invested; } else i.snapshots.push({date:td,value:nv,invested:i.invested}); }
    await save(); closeModal(); render(); toast('Zapisano'); return;
  }
  if(a==='delinst'){ modalConfirm('Usunąć pozycję?','Pozycja zostanie trwale usunięta.','confirmdelinst',{id:d.id}); return; }
  if(a==='confirmdelinst'){ DATA.instruments=DATA.instruments.filter(x=>x.id!==d.id); await save(); closeModal(); render(); toast('Usunięto'); return; }

  if(a==='savepf'){
    const name=document.getElementById('pf-name').value.trim(); if(!name) return toast('Podaj nazwę');
    const badge=(document.getElementById('pf-badge').value.trim()||name.slice(0,2)).toUpperCase();
    const color=document.getElementById('pf-color').value;
    const hidden=!document.getElementById('pf-inmajatek').checked;
    if(d.pf){ const p=DATA.portfolios.find(x=>x.id===d.pf); Object.assign(p,{name,badge,color,hidden}); }
    else { const id=uid('p_'); DATA.portfolios.push({id,name,badge,color,hidden}); view={screen:'pf',pfId:id}; }
    await save(); closeModal(); render(); toast('Zapisano'); return;
  }
  if(a==='delpf'){ modalConfirm('Usunąć portfel?','Portfel i wszystkie jego pozycje zostaną usunięte.','confirmdelpf',{pf:d.pf}); return; }
  if(a==='confirmdelpf'){ DATA.portfolios=DATA.portfolios.filter(x=>x.id!==d.pf);
    DATA.instruments=DATA.instruments.filter(x=>x.portfolioId!==d.pf); delete DATA.history[d.pf];
    await save(); closeModal(); view={screen:'wealth'}; render(); toast('Usunięto portfel'); return; }

  if(a==='saveclass'){
    const name=document.getElementById('cl-name').value.trim(); if(!name) return toast('Podaj nazwę');
    DATA.classes.push({id:uid('c_'),name,color:document.getElementById('cl-color').value});
    await save(); closeModal(); render(); toast('Dodano klasę'); return;
  }
  if(a==='delclass'){
    const used=DATA.instruments.some(x=>x.classId===d.id);
    if(used) return toast('Najpierw przenieś pozycje z tej klasy');
    DATA.classes=DATA.classes.filter(x=>x.id!==d.id); await save(); render(); toast('Usunięto klasę'); return;
  }
  if(a==='savepftargets'){ document.querySelectorAll('[data-pftgt]').forEach(inp=>{ const p=DATA.portfolios.find(x=>x.id===inp.dataset.pftgt); if(p)p.target=parseNum(inp.value); });
    await save(); closeModal(); render(); toast('Zapisano cel majątkowy'); return; }
  if(a==='savepostargets'){ document.querySelectorAll('[data-postgt]').forEach(inp=>{ const it=DATA.instruments.find(x=>x.id===inp.dataset.postgt); if(it)it.targetPct=parseNum(inp.value); });
    await save(); closeModal(); render(); toast('Zapisano cel portfela'); return; }
  if(a==='savesettings'){ DATA.settings.twelveKey=document.getElementById('set-td').value.trim();
    DATA.settings.geckoKey=document.getElementById('set-gecko').value.trim(); await save(); toast('Zapisano'); refreshPrices(true); return; }
});

document.addEventListener('input', e=>{
  const t=e.target; if(!t||!t.matches) return;
  if(t.matches('[data-pftgt]')){ const s=[...document.querySelectorAll('[data-pftgt]')].reduce((a,i)=>a+parseNum(i.value),0); const b=document.querySelector('#pftgt-sum b'); if(b) b.textContent=s+'%'; }
  else if(t.matches('[data-postgt]')){ const s=[...document.querySelectorAll('[data-postgt]')].reduce((a,i)=>a+parseNum(i.value),0); const b=document.querySelector('#postgt-sum b'); if(b) b.textContent=s+'%'; }
});

document.addEventListener('change', e=>{ if(!e.target||e.target.id!=='imp-file') return; const f=e.target.files&&e.target.files[0]; if(!f) return;
  const rd=new FileReader(); rd.onload=async()=>{ try{ const obj=JSON.parse(rd.result); if(!obj||!obj.instruments) throw 0;
    const keep=(DATA&&DATA.settings)||{}; DATA=obj; normalizeData();
    DATA.settings.twelveKey=DATA.settings.twelveKey||keep.twelveKey; DATA.settings.geckoKey=DATA.settings.geckoKey||keep.geckoKey;
    await save(); view={screen:'wealth',pfId:null}; render(); toast('Wczytano dane z pliku'); refreshPrices(true);
  }catch(_){ toast('Nieprawidłowy plik JSON'); } }; rd.readAsText(f); });

let toastT;
function toast(m){ const t=document.getElementById('toast'); t.textContent=m; t.classList.add('on'); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('on'),2400); }

/* ============================================================
   AUTH
   ============================================================ */
const lockEl=document.getElementById('lock'), appEl=document.getElementById('app');
function hint(msg,ok){ const h=document.getElementById('lock-hint'); h.textContent=msg||''; h.className='lock-hint'+(msg?(ok?' ok':' err'):''); }
function setAuthMode(m){ authMode=m;
  document.getElementById('lock-title').textContent=m==='login'?'Zaloguj się':'Załóż konto';
  document.getElementById('au-submit').textContent=m==='login'?'Zaloguj się':'Zarejestruj się';
  document.getElementById('au-toggle').textContent=m==='login'?'Nie masz konta? Załóż je':'Masz już konto? Zaloguj się';
  document.getElementById('au-pass').setAttribute('autocomplete',m==='login'?'current-password':'new-password'); hint(''); }
function authErr(m){ m=(m||'').toLowerCase();
  if(m.includes('invalid login')) return 'Błędny e-mail lub hasło';
  if(m.includes('already')) return 'Konto już istnieje — zaloguj się';
  if(m.includes('not confirmed')) return 'Potwierdź e-mail, zanim się zalogujesz';
  if(m.includes('at least 6')||m.includes('password should')) return 'Hasło musi mieć min. 6 znaków';
  if(m.includes('fetch')||m.includes('network')) return 'Brak połączenia z Supabase — sprawdź URL i klucz w kodzie';
  return m||'Coś poszło nie tak'; }
async function doAuth(){
  if(!CONFIG_OK){ hint('Uzupełnij SUPABASE_URL i klucz w kodzie (sekcja KONFIGURACJA).'); return; }
  const email=document.getElementById('au-email').value.trim(), pass=document.getElementById('au-pass').value;
  if(!email||!pass) return hint('Podaj e-mail i hasło');
  const btn=document.getElementById('au-submit'); btn.disabled=true; btn.textContent='…';
  try{
    if(authMode==='login'){ const {error}=await supabase.auth.signInWithPassword({email,password:pass}); if(error) throw error; }
    else{ if(pass.length<6) throw new Error('at least 6'); const {data,error}=await supabase.auth.signUp({email,password:pass}); if(error) throw error;
      if(!data.session){ hint('Konto założone. Sprawdź e-mail i potwierdź, potem zaloguj się.',true); setAuthMode('login'); } }
  }catch(e){ hint(authErr(e.message)); }
  finally{ btn.disabled=false; btn.textContent=authMode==='login'?'Zaloguj się':'Zarejestruj się'; }
}
async function unlock(){ lockEl.style.display='none'; appEl.style.display='block';
  await loadData(); view={screen:'wealth',pfId:null}; render(); await fetchFx(); render(); refreshPrices(true); }
function showLock(){ appEl.style.display='none'; lockEl.style.display='flex'; DATA=null;
  const p=document.getElementById('au-pass'); if(p)p.value=''; setAuthMode('login'); }

document.getElementById('au-submit').addEventListener('click',doAuth);
document.getElementById('au-toggle').addEventListener('click',()=>setAuthMode(authMode==='login'?'signup':'login'));
document.getElementById('au-email').addEventListener('keydown',e=>{if(e.key==='Enter')document.getElementById('au-pass').focus();});
document.getElementById('au-pass').addEventListener('keydown',e=>{if(e.key==='Enter')doAuth();});

(function init(){
  setAuthMode('login');
  if(!CONFIG_OK){ hint('Uzupełnij SUPABASE_URL i klucz w kodzie (sekcja KONFIGURACJA na górze <script>).'); return; }
  supabase.auth.onAuthStateChange((_e,session)=>{
    if(session?.user){ currentUser=session.user; if(!started){ started=true; unlock(); } }
    else { currentUser=null; if(started) started=false; showLock(); }
  });
})();
</script>
